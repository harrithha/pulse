<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Pulse: your personal daily news editor" />
    <meta property="og:title" content="Pulse" />
    <meta property="og:description" content="Pulse: your personal daily news editor" />
    <meta property="og:url" content="https://pulse-7m9v.vercel.app/?v=2" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://pulse-7m9v.vercel.app/favicon.png?v=2" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Pulse" />
    <meta name="twitter:description" content="Pulse: your personal daily news editor" />
    <meta name="theme-color" content="#07070C" />
    <script>
      try {
        var prefs = JSON.parse(localStorage.getItem('pulse-prefs') || '{}')
        if (prefs.theme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light')
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#F6F1EA')
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="apple-touch-icon" href="/favicon-32.png?v=4" />
    <title>Pulse</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
